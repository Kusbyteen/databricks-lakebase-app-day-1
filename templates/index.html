<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Massive Stock Watchlist</title>
  <style>
    :root {
      --bg-a: #edf0f6;
      --bg-b: #e4eaf3;
      --card: #ffffff;
      --text: #17202e;
      --muted: #66748a;
      --accent: #ff3621;
      --accent-dark: #d92c19;
      --border: #e4e9f0;
      --radius: 14px;
      --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 10px 30px rgba(15, 23, 42, .10);
      --red: #b3261e;
      --red-bg: #fdecea;
      --green: #0e8a5f;
      --green-bg: #e7f6ef;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: linear-gradient(165deg, var(--bg-a), var(--bg-b));
      min-height: 100vh;
      margin: 0;
      padding: 48px 20px;
      color: var(--text);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    .hero {
      background:
        radial-gradient(500px 200px at 85% -30%, rgba(255, 54, 33, .45), transparent 65%),
        linear-gradient(135deg, #1b2432, #2a1a22 60%, #471d15);
      color: #fff;
      border-radius: var(--radius);
      padding: 30px 28px;
      margin: 0 auto 24px;
      max-width: 660px;
      box-shadow: var(--shadow);
    }
    .hero h1 { font-size: 26px; font-weight: 700; margin: 0 0 6px; letter-spacing: -0.02em; }
    .hero .hint { color: rgba(255, 255, 255, .72); font-size: 14px; margin: 0; max-width: 48ch; }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 24px;
      margin: 0 auto 24px;
      max-width: 660px;
    }
    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 8px; }
    .input-row { display: flex; gap: 12px; }
    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      font-size: 16px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #fbfcfe;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(255, 54, 33, .12);
      background: #fff;
    }
    button {
      padding: 10px 20px;
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .05s;
    }
    button:hover { background: var(--accent-dark); }
    button:active { transform: translateY(1px); }
    #result {
      max-width: 660px;
      margin: 0 auto 24px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      background: #eef2f8;
      color: var(--text);
      white-space: pre-wrap;
      border: 1px solid transparent;
    }
    #result:empty { display: none; }
    #result.error { background: var(--red-bg); color: var(--red); border-color: #f2c4c0; }
    #result.success { background: var(--green-bg); color: var(--green); border-color: #bde5d1; }
    .table-card { padding: 0; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid var(--border); }
    th {
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .04em;
      background: #f7f9fc;
    }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #f7f9fc; }
    td.symbol {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 600;
      letter-spacing: .02em;
    }
    td.email, td.updated { color: var(--muted); }
    td.updated { font-size: 13px; white-space: nowrap; }
    .price {
      font-variant-numeric: tabular-nums;
      font-weight: 600;
      background: #eef2f8;
      padding: 3px 10px;
      border-radius: 999px;
    }
    th.th-actions { width: 140px; }
    td.actions { display: flex; justify-content: flex-end; gap: 8px; }
    .delete-btn {
      width: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--muted);
      font-size: 16px;
      line-height: 1;
      border: 1px solid var(--border);
      transition: background .15s, color .15s, border-color .15s;
    }
    .delete-btn:hover { background: var(--red-bg); color: var(--red); border-color: #f2c4c0; }
    .delete-btn:disabled { opacity: .5; cursor: default; }
    .news-btn {
      padding: 5px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 999px;
      transition: border-color .15s, color .15s, background .15s;
    }
    .news-btn:hover { background: var(--accent); border-color: var(--accent); color: #fff; }
    .news-btn:active { transform: none; }
    .news-row td { background: #f7f9fc; padding: 0 16px 16px; }
    .news-panel {
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
    }
    .news-list { list-style: none; margin: 0; padding: 0; }
    .news-list li { padding: 8px 0; border-bottom: 1px solid var(--border); }
    .news-list li:last-child { border-bottom: none; }
    .news-list a { color: #2547cf; text-decoration: none; font-weight: 500; }
    .news-list a:hover { text-decoration: underline; }
    .news-meta { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
    .news-empty { color: var(--muted); font-style: italic; margin: 0; }
    .empty-row td { color: var(--muted); text-align: center; padding: 24px; font-style: italic; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      clip: rect(0 0 0 0);
      overflow: hidden;
    }
    @media (max-width: 520px) {
      body { padding: 24px 16px; }
      .input-row { flex-direction: column; }
      th, td { padding: 10px 12px; }
    }
  </style>
</head>
<body>
  <header class="hero">
    <h1>Stock Watchlist</h1>
    <p class="hint">Enter a single ticker symbol. This sends exactly ONE call to the Massive API to fetch the latest price, then adds it to your watchlist.</p>
  </header>

  <form id="stock-form" class="card">
    <label for="symbol">Ticker symbol</label>
    <div class="input-row">
      <input type="text" id="symbol" name="symbol" placeholder="AAPL" required>
      <button type="submit">Add to watchlist</button>
    </div>
  </form>

  <div id="result"></div>

  <div class="card table-card">
    <table id="watchlist-table">
      <thead>
        <tr>
          <th>Symbol</th>
          <th>Email</th>
          <th>Latest price</th>
          <th>Updated</th>
          <th class="th-actions"><span class="visually-hidden">Actions</span></th>
        </tr>
      </thead>
      <tbody id="watchlist-body"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById("stock-form");
    const resultEl = document.getElementById("result");

    function setResult(text, kind) {
      resultEl.textContent = text;
      resultEl.className = kind || "";
    }
    const watchlistBody = document.getElementById("watchlist-body");

    async function loadWatchlist() {
      try {
        const resp = await fetch("/watchlist");
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error loading watchlist: " + (data.error || resp.statusText), "error");
          return;
        }
        watchlistBody.innerHTML = "";
        if (data.length === 0) {
          watchlistBody.innerHTML = '<tr class="empty-row"><td colspan="5">No stocks on your watchlist yet.</td></tr>';
          return;
        }
        data.forEach((row) => {
          const tr = document.createElement("tr");
          const price = row.latest_price !== null && row.latest_price !== undefined
            ? Number(row.latest_price).toFixed(2)
            : "-";
          const updated = row.updated_at ? new Date(row.updated_at).toLocaleString() : "-";
          tr.innerHTML = `<td class="symbol">${row.symbol}</td><td class="email">${row.email || "-"}</td><td><span class="price">${price}</span></td><td class="updated">${updated}</td><td class="actions"><button class="news-btn" data-symbol="${row.symbol}" aria-label="News for ${row.symbol}">News</button><button class="delete-btn" data-symbol="${row.symbol}" title="Remove ${row.symbol}" aria-label="Remove ${row.symbol}">\u00d7</button></td>`;
          watchlistBody.appendChild(tr);
        });
      } catch (err) {
        setResult("Failed to load watchlist: " + err, "error");
      }
    }

    const newsCache = {};

    function escapeHtml(text) {
      return String(text || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function newsPanelHtml(items) {
      if (!items || items.length === 0) {
        return '<p class="news-empty">No recent news found for this symbol.</p>';
      }
      const listItems = items.map((item) => {
        const date = item.published_utc ? new Date(item.published_utc).toLocaleDateString() : "";
        const pub = item.publisher ? " \u00b7 " + item.publisher : "";
        return `<li><a href="${escapeHtml(item.article_url)}" target="_blank" rel="noopener">${escapeHtml(item.title)}</a><span class="news-meta">${escapeHtml(date + pub)}</span></li>`;
      });
      return '<ul class="news-list">' + listItems.join("") + "</ul>";
    }

    async function toggleNews(btn) {
      const symbol = btn.dataset.symbol;
      const row = btn.closest("tr");
      const existing = row.nextElementSibling;

      if (existing && existing.classList.contains("news-row")) {
        existing.remove();
        return;
      }

      const newsRow = document.createElement("tr");
      newsRow.className = "news-row";
      newsRow.innerHTML = `<td colspan="5"><div class="news-panel">Loading news...</div></td>`;
      row.after(newsRow);
      const panel = newsRow.querySelector(".news-panel");

      try {
        let items;
        if (newsCache[symbol]) {
          items = newsCache[symbol];
        } else {
          const resp = await fetch("/news/" + encodeURIComponent(symbol), { method: "POST" });
          const data = await resp.json();
          if (!resp.ok) {
            panel.innerHTML = escapeHtml(data.error || resp.statusText);
            return;
          }
          items = data.items || [];
          newsCache[symbol] = items;
        }
        panel.innerHTML = newsPanelHtml(items);
      } catch (err) {
        panel.innerHTML = escapeHtml("Request failed: " + err);
      }
    }

    watchlistBody.addEventListener("click", async (e) => {
      const newsBtn = e.target.closest(".news-btn");
      if (newsBtn) {
        await toggleNews(newsBtn);
        return;
      }
      const btn = e.target.closest(".delete-btn");
      if (!btn) return;
      const symbol = btn.dataset.symbol;
      btn.disabled = true;
      try {
        const resp = await fetch("/watchlist", {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error removing " + symbol + ": " + (data.error || resp.statusText), "error");
          btn.disabled = false;
          return;
        }
        setResult("Removed " + symbol + " from your watchlist.", "success");
        loadWatchlist();
      } catch (err) {
        setResult("Request failed: " + err, "error");
        btn.disabled = false;
      }
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value;
      setResult("Adding to watchlist...");

      try {
        const resp = await fetch("/watchlist", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ symbol }),
        });
        const data = await resp.json();
        if (!resp.ok) {
          setResult("Error: " + (data.error || resp.statusText), "error");
          return;
        }
        setResult("Added " + data.symbol + " at price " + data.latest_price, "success");
        document.getElementById("symbol").value = "";
        loadWatchlist();
      } catch (err) {
        setResult("Request failed: " + err, "error");
      }
    });

    loadWatchlist();
  </script>
</body>
</html>
